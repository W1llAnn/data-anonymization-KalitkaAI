name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Установка зависимостей
        run: pip install ".[dev]"

      # Весь репозиторий: каталоги ролей (dataset/ и др.) попадают в проверку по мере мержа
      - name: Ruff (lint + формат)
        run: |
          ruff check .
          ruff format --check .

      - name: Mypy
        run: mypy

      - name: Генератор датасета (smoke)
        if: hashFiles('dataset/generator/**') != ''
        run: python -m dataset.generator --count 3 --seed 7 --out /tmp/samples.jsonl --registry /tmp/registry.csv

      - name: Pytest (unit)
        run: pytest -q -m unit

      # Код 5 — «тесты не найдены»: интеграционные проверки добавляет Р6
      - name: Pytest (integration)
        run: pytest -q -m integration || [ $? -eq 5 ]

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: docker compose up (сервис + mock)
        run: docker compose up -d --build --wait --wait-timeout 120

      - name: /health обоих контейнеров
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS http://localhost:9000/health

      - name: Логи контейнеров
        if: failure()
        run: docker compose logs

      - name: Остановка
        if: always()
        run: docker compose down
